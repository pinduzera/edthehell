<div class="article-meta">
  <time datetime="{{ .Date.Format "2006-01-02" }}">{{ time.Format (site.Params.dateFormat | default "2 January 2006") .Date }}</time>
  {{ if and (eq .Type "posts") (ne .ReadingTime 0) }}
  <span class="meta-sep">&middot;</span>
  <span>{{ i18n "minRead" (dict "Count" .ReadingTime) }}</span>
  {{ end }}
</div>
