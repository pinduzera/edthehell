{{- $external := .Params.externalUrl -}}
<a class="link-row" href="{{ with $external }}{{ . }}{{ else }}{{ .RelPermalink }}{{ end }}" {{ with $external }}target="_blank" rel="noopener"{{ end }}>
  <span class="link-row-title"{{ if not $external }} style="view-transition-name: vt-title-{{ .File.UniqueID }}"{{ end }}>{{ .Title | emojify }}</span>
  <span class="link-row-meta">{{ time.Format (site.Params.listDateFormat | default "2 Jan 2006") .Date }}{{ with $external }} <span class="ext-arrow-inline">&#8599;</span>{{ end }}</span>
</a>
