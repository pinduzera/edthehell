# -- Site Configuration --

# English stays at the site root (/), Portuguese lives under /pt/.
defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false

baseURL: "https://thehellas.com/"
enableRobotsTXT: true
enableGitInfo: true
summaryLength: 0
enableEmoji: true

pagination:
  pagerSize: 15

outputs:
  home: ["HTML", "RSS", "searchindex"]

outputFormats:
  searchindex:
    mediaType: "application/json"
    baseName: "index"
    isPlainText: true
    notAlternative: true

module:
  imports:
    - path: "github.com/omegion/hugo-omegion"
