# -- Site Configuration --

# English stays at the site root (/), Portuguese lives under /pt/.
defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false

baseURL: "https://thehellas.com/"
enableRobotsTXT: true
enableGitInfo: true
summaryLength: 0
enableEmoji: true

pagination:
  pagerSize: 15

# Post URLs: content/posts/<slug>/index.md -> /posts/2026/11/<slug>/
# The date lives in front matter, so it is not repeated in the folder name.
permalinks:
  posts: "/posts/:year/:month/:slug/"

outputs:
  home: ["HTML", "RSS", "searchindex"]

outputFormats:
  searchindex:
    mediaType: "application/json"
    baseName: "index"
    isPlainText: true
    notAlternative: true

module:
  imports:
    - path: "github.com/omegion/hugo-omegion"
